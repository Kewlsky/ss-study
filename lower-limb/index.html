<style>
:root {
  --bg: #f5f3f8; --surface: #ffffff; --surface-2: #ece8f2; --ink: #211a30; --ink-soft: #5a5070; --line: #dad3e5;
  --eosin: #b02f5c; --hema: #47389a; --on-hema: #ffffff; --glass: #fbfaf7;
  --ok: #1f7a55; --ok-bg: #e2f3ea; --bad: #b3261e; --bad-bg: #fbe6e4; --warn: #8a5a00; --warn-bg: #fbefd6;
  --e: #1f7a55; --e-bg: #e2f3ea; --m: #8a5a00; --m-bg: #fbefd6; --h: #b02f5c; --h-bg: #fbe7ef;
  --shade: rgba(20, 14, 30, .9);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131019; --surface: #1c1724; --surface-2: #262031; --ink: #ece7f4; --ink-soft: #b2a9c3; --line: #362e44;
    --eosin: #f17ba1; --hema: #aa9df2; --on-hema: #15111d; --glass: #f3f1ec;
    --ok: #5fcf9b; --ok-bg: #16302a; --bad: #ff8a80; --bad-bg: #3a1c1f; --warn: #f2c063; --warn-bg: #342812;
    --e: #5fcf9b; --e-bg: #16302a; --m: #f2c063; --m-bg: #342812; --h: #f17ba1; --h-bg: #3a1a28;
    --shade: rgba(5, 3, 9, .94); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131019; --surface: #1c1724; --surface-2: #262031; --ink: #ece7f4; --ink-soft: #b2a9c3; --line: #362e44;
  --eosin: #f17ba1; --hema: #aa9df2; --on-hema: #15111d; --glass: #f3f1ec;
  --ok: #5fcf9b; --ok-bg: #16302a; --bad: #ff8a80; --bad-bg: #3a1c1f; --warn: #f2c063; --warn-bg: #342812;
  --e: #5fcf9b; --e-bg: #16302a; --m: #f2c063; --m-bg: #342812; --h: #f17ba1; --h-bg: #3a1a28;
  --shade: rgba(5, 3, 9, .94); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1.06rem; line-height: 1.55; min-height: 100vh; }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--hema); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; }

/* bar */
.bar { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.bar-in { display: flex; align-items: center; gap: 10px; min-height: 56px; }
.brand { flex: 1 1 auto; min-width: 0; font-family: var(--font-display); font-weight: 750; font-size: 1.12rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.brand span { color: var(--eosin); }
.pill { flex: none; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 5px 12px; font: 600 .9rem var(--font-body); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.clock { font-family: var(--font-mono); font-size: .9rem; font-variant-numeric: tabular-nums; }
.clock.low { color: var(--bad); border-color: var(--bad); }
.track { height: 4px; background: var(--surface-2); }
.track i { display: block; height: 100%; width: 0; background: var(--hema); transition: width .3s; }

/* buttons */
.btn { font-weight: 700; font-size: 1rem; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 12px; padding: 12px 18px; cursor: pointer; line-height: 1.2; min-height: 48px; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.accent { background: var(--hema); border-color: var(--hema); color: var(--on-hema); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:not(:disabled):active { transform: scale(.98); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }

/* start */
.hero { padding: 26px 0 8px; }
.hero h1 { font-size: clamp(2rem, 8vw, 2.9rem); font-weight: 750; letter-spacing: -.01em; }
.hero h1 span { color: var(--eosin); }
.hero p { color: var(--ink-soft); margin-top: 10px; max-width: 34em; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.fact b { font-family: var(--font-display); font-size: 1.25rem; display: block; line-height: 1.1; }
.fact small { color: var(--ink-soft); font-size: .82rem; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 16px; }
.box h3 { font-size: 1.02rem; margin-bottom: 10px; }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.seg button { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; cursor: pointer; min-height: 48px; }
.seg button b { display: block; font-size: .98rem; }
.seg button small { color: var(--ink-soft); font-size: .84rem; line-height: 1.3; display: block; }
.seg button[aria-pressed="true"] { border-color: var(--hema); background: color-mix(in srgb, var(--hema) 9%, var(--surface)); box-shadow: inset 0 0 0 1px var(--hema); }
.note { color: var(--ink-soft); font-size: .9rem; margin-top: 12px; }
.start-actions { margin: 18px 0 40px; display: grid; gap: 10px; }

/* station */
.station { padding: 16px 0 120px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 10px; }
.chip { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 10px; font: 500 .72rem var(--font-mono); letter-spacing: .05em; text-transform: uppercase; border: 1px solid var(--line); color: var(--ink-soft); background: var(--surface); }
.chip.e { color: var(--e); background: var(--e-bg); border-color: transparent; }
.chip.m { color: var(--m); background: var(--m-bg); border-color: transparent; }
.chip.h { color: var(--h); background: var(--h-bg); border-color: transparent; }
.num { font-family: var(--font-display); font-weight: 750; font-size: 1.05rem; margin-right: 4px; }
.stem { font-size: 1.22rem; font-weight: 650; }
figure { margin: 14px 0 4px; background: var(--glass); border: 1px solid var(--line); border-radius: 16px; padding: 10px; display: flex; justify-content: center; }
.pic { position: relative; display: inline-block; line-height: 0; cursor: zoom-in; max-width: 100%; }
.pic img { display: block; max-width: 100%; max-height: 46vh; width: auto; height: auto; border-radius: 6px; }
.pic svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.zoomhint { text-align: center; color: var(--ink-soft); font-size: .8rem; margin-bottom: 8px; }
.opts { display: grid; gap: 10px; margin-top: 14px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; cursor: pointer; min-height: 54px; }
.opt .k { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font: 700 .9rem var(--font-display); background: var(--surface-2); }
.opt[aria-pressed="true"] { border-color: var(--hema); box-shadow: inset 0 0 0 1px var(--hema); }
.opt[aria-pressed="true"] .k { background: var(--hema); color: var(--on-hema); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); box-shadow: inset 0 0 0 1px var(--ok); }
.opt.right .k { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); box-shadow: inset 0 0 0 1px var(--bad); }
.opt.wrong .k { background: var(--bad); color: #fff; }
.opt:disabled { cursor: default; color: var(--ink); opacity: 1; }
.parts { display: grid; gap: 14px; margin-top: 14px; }
.part label { display: flex; gap: 10px; align-items: baseline; font-weight: 600; margin-bottom: 6px; }
.part .pn { flex: none; font: 700 .85rem var(--font-display); width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); }
.part input { width: 100%; font: inherit; font-size: 1.05rem; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); min-height: 50px; }
.part input:focus { border-color: var(--hema); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--hema) 25%, transparent); }
.part.ok input { border-color: var(--ok); background: var(--ok-bg); }
.part.bad input { border-color: var(--bad); background: var(--bad-bg); }
.verdict { margin-top: 6px; font-size: .95rem; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.verdict .ok { color: var(--ok); font-weight: 700; }
.verdict .bad { color: var(--bad); font-weight: 700; }
.linkbtn { border: 0; background: none; padding: 2px 0; color: var(--hema); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: .92rem; }
.why { margin-top: 14px; border-radius: 14px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--hema); }
.why b.t { display: block; font-family: var(--font-display); margin-bottom: 4px; }
.why.ok { border-left-color: var(--ok); } .why.bad { border-left-color: var(--bad); }
.why .ref { color: var(--ink-soft); font-size: .82rem; margin-top: 6px; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: color-mix(in srgb, var(--surface) 94%, transparent); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); backdrop-filter: saturate(1.2); }
.dock .wrap { display: flex; gap: 10px; padding-top: 10px; padding-bottom: 10px; }
.dock .btn { flex: 1 1 0; }
.dock .btn.back { flex: 0 0 auto; padding-inline: 16px; }

/* station map */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--shade); display: flex; align-items: flex-end; justify-content: center; }
.sheet-in { background: var(--surface); width: 100%; max-width: 720px; max-height: 86vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet-in h3 { font-size: 1.15rem; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 8px; }
.grid button { aspect-ratio: 1; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; font: 700 .95rem var(--font-display); cursor: pointer; }
.grid button.done { background: var(--surface-2); border-color: var(--ink-soft); }
.grid button.cur { border-color: var(--hema); box-shadow: inset 0 0 0 1.5px var(--hema); }
.grid button.r { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.grid button.w { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-soft); font-size: .85rem; margin-top: 12px; }
.x { border: 1px solid var(--line); background: var(--surface-2); width: 38px; height: 38px; border-radius: 10px; cursor: pointer; font-size: 1.1rem; }
.dialog { position: fixed; inset: 0; z-index: 30; background: var(--shade); display: grid; place-items: center; padding: 16px; }
.dialog-in { background: var(--surface); border-radius: 18px; padding: 20px; max-width: 420px; width: 100%; }
.dialog-in p { margin: 8px 0 16px; color: var(--ink-soft); }

/* lightbox */
.lb { position: fixed; inset: 0; z-index: 40; background: #0c0a10; overflow: auto; -webkit-overflow-scrolling: touch; }
.lb .pic { cursor: zoom-out; display: block; margin: 0 auto; width: max-content; max-width: none; padding: 56px 8px 24px; }
.lb .pic img { max-height: none; max-width: none; width: min(100vw - 16px, 1100px); background: #fff; }
.lb .x { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 41; background: #fff; color: #111; border: 0; }

/* results */
.res { padding: 22px 0 60px; }
.score { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.ring { --p: 0; width: 120px; height: 120px; border-radius: 50%; background: conic-gradient(var(--hema) calc(var(--p) * 1%), var(--surface-2) 0); display: grid; place-items: center; flex: none; }
.ring div { width: 94px; height: 94px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font: 750 1.6rem var(--font-display); }
.score h1 { font-size: 1.8rem; }
.score p { color: var(--ink-soft); margin-top: 4px; }
.bars { display: grid; gap: 10px; margin-top: 18px; }
.barrow { display: grid; grid-template-columns: 92px 1fr 72px; gap: 10px; align-items: center; font-size: .95rem; }
.barrow .b { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.barrow .b i { display: block; height: 100%; border-radius: 99px; }
.barrow span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
.list { margin-top: 18px; display: grid; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.item > button { width: 100%; display: flex; gap: 10px; align-items: center; text-align: left; background: none; border: 0; padding: 12px 14px; cursor: pointer; }
.mark { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: .9rem; }
.mark.r { background: var(--ok-bg); color: var(--ok); } .mark.w { background: var(--bad-bg); color: var(--bad); } .mark.p { background: var(--warn-bg); color: var(--warn); }
.item .s { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .pts { flex: none; color: var(--ink-soft); font-size: .85rem; font-variant-numeric: tabular-nums; }
.item .body { padding: 0 14px 14px; border-top: 1px solid var(--line); }
.item .body .station { padding: 12px 0 0; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; }
.filters button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 600; cursor: pointer; }
.filters button[aria-pressed="true"] { border-color: var(--hema); color: var(--hema); }
footer { color: var(--ink-soft); font-size: .82rem; text-align: center; padding: 10px 0 30px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
const DATA = {"q":[{"t":"m","lv":"e","sec":"Hip bone","stem":"The coloured part of the hip bone at the arrow is the:","o":["Ischium","Ilium","Pubis","Sacrum"],"why":"The hip bone is three bones joined at the acetabulum: ilium on top, pubis in front, ischium at the back and bottom. The arrow is on the lower back part, so it is the ischium.","ref":"p.2","pic":{"src":"img/tri.jpg","w":420,"h":560,"a":[[205.0,470.0,"r"]]},"id":1},{"t":"m","lv":"e","sec":"Hip bone","stem":"Identify the opening at the arrow.","o":["Obturator foramen","Acetabulum","Greater sciatic notch","Lesser sciatic notch"],"why":"The big hole under the acetabulum, framed by the pubis and the ischium, is the obturator foramen. The acetabulum is the cup above it.","ref":"p.2–3","pic":{"src":"img/pelvis.jpg","w":900,"h":675,"a":[[282.8,432.0,"b"]]},"id":2},{"t":"m","lv":"e","sec":"Hip bone","stem":"Which part of the hip bone do you sit on?","o":["Ischial tuberosity","Ischial spine","Pubic tubercle","Iliac crest"],"why":"Your notes mark the ischial tuberosity as the sitting area (مكان الجلوس).","ref":"p.4","pic":null,"id":3},{"t":"m","lv":"m","sec":"Hip bone","stem":"Lateral view of the hip bone. Identify the spine at the arrow.","o":["Anterior superior iliac spine (ASIS)","Anterior inferior iliac spine (AIIS)","Posterior superior iliac spine (PSIS)","Posterior inferior iliac spine (PIIS)"],"why":"Front border of the ilium = the two anterior spines. The upper one, at the front end of the iliac crest, is the ASIS; the AIIS is the smaller one below it.","ref":"p.3","pic":{"src":"img/hipL.jpg","w":530,"h":480,"a":[[472.0,186.0,"r"]]},"id":4},{"t":"m","lv":"h","sec":"Hip bone","stem":"Lateral view of the hip bone. Identify the structure at the arrow.","o":["Posterior inferior iliac spine (PIIS)","Posterior superior iliac spine (PSIS)","Greater sciatic notch","Ischial spine"],"why":"Back border of the ilium, from top to bottom: PSIS, then PIIS, then the deep greater sciatic notch.","ref":"p.3","pic":{"src":"img/hipL.jpg","w":530,"h":480,"a":[[138.0,360.0,"l"]]},"id":5},{"t":"w","lv":"m","sec":"Hip bone","stem":"Lateral view of the hip bone.","parts":[["Name the notch at the arrow.",["greater sciatic notch","greater sciatic"]]],"why":"The deep notch on the back border, under the PIIS, is the greater sciatic notch. The lesser sciatic notch is lower down, on the ischium, under the ischial spine.","ref":"p.3–4","pic":{"src":"img/hipL.jpg","w":530,"h":480,"a":[[228.0,370.0,"bl",110.0]]},"id":6},{"t":"m","lv":"h","sec":"Hip bone","stem":"Medial view of the ilium. Identify the surface at the arrow.","o":["Auricular surface","Iliac tuberosity","Wing (ala) of the ilium","Greater sciatic notch"],"why":"Medial view: the ear-shaped surface at the back is the auricular surface (it joins the sacrum). The rough area just above it is the iliac tuberosity.","ref":"p.3","pic":{"src":"img/hipM.jpg","w":460,"h":403,"a":[[360.0,285.0,"b"]]},"id":7},{"t":"m","lv":"m","sec":"Hip bone","stem":"Identify the structure at the arrow (the pubis is coloured green).","o":["Pubic tubercle","Pubic crest","Obturator crest","Ischial spine"],"why":"The small knob at the front of the pubis, at the end of the superior pubic ramus, is the pubic tubercle.","ref":"p.2–3","pic":{"src":"img/pubis.jpg","w":798,"h":416,"a":[[306.0,256.0,"r"]]},"id":8},{"t":"w","lv":"m","sec":"Hip bone","stem":"The ischium (coloured blue).","parts":[["Name the pointed projection at the arrow.",["ischial spine","spine of ischium"]]],"why":"The pointed projection on the back border of the ischium is the ischial spine. Above it is the greater sciatic notch, below it the lesser sciatic notch.","ref":"p.4","pic":{"src":"img/ischB.jpg","w":558,"h":614,"a":[[170.0,152.0,"l"]]},"id":9},{"t":"m","lv":"h","sec":"Hip bone","stem":"The ischium (coloured blue). Identify the notch at the arrow.","o":["Lesser sciatic notch","Greater sciatic notch","Obturator foramen","Acetabular notch"],"why":"Under the ischial spine comes the lesser sciatic notch. The greater sciatic notch is above the spine.","ref":"p.4","pic":{"src":"img/ischB.jpg","w":558,"h":614,"a":[[200.0,238.0,"l"]]},"id":10},{"t":"m","lv":"h","sec":"Hip bone","stem":"The upper quadrangular area of the ischial tuberosity is divided by an oblique ridge into:","o":["An upper lateral and a lower medial part","A lateral and a medial part","An upper medial and a lower lateral part","An anterior and a posterior part"],"why":"Upper quadrangular area + oblique ridge = upper lateral (UL) and lower medial (LM). Lower triangular area + longitudinal ridge = lateral (L) and medial (M).","ref":"p.4","pic":null,"id":11},{"t":"m","lv":"m","sec":"Femur","stem":"Front of the femur. Identify the bump at the arrow.","o":["Lesser trochanter","Greater trochanter","Adductor tubercle","Fovea capitis"],"why":"At the top of the shaft, the small bump on the medial side (same side as the head) is the lesser trochanter. The big one on the lateral side is the greater trochanter.","ref":"p.5","pic":{"src":"img/femA.jpg","w":351,"h":900,"a":[[216.2,192.4,"r"]]},"id":12},{"t":"m","lv":"h","sec":"Femur","stem":"Front of the femur, lower end. Identify the small bump at the arrow.","o":["Adductor tubercle","Medial epicondyle","Lateral epicondyle","Medial condyle"],"why":"On the medial side, just above the medial epicondyle, is the small adductor tubercle.","ref":"p.5","pic":{"src":"img/femA.jpg","w":351,"h":900,"a":[[301.9,724.5,"r"]]},"id":13},{"t":"m","lv":"m","sec":"Femur","stem":"Back of the femur. Identify the rough area at the arrow.","o":["Gluteal tuberosity","Quadrate tubercle","Linea aspera","Intertrochanteric crest"],"why":"On the back of the upper shaft, on the lateral side under the greater trochanter, is the gluteal tuberosity. It runs down into the linea aspera.","ref":"p.5","pic":{"src":"img/femP.jpg","w":300,"h":840,"a":[[196.0,240.0,"r"]]},"id":14},{"t":"m","lv":"h","sec":"Femur","stem":"Back of the femur. Identify the small bump at the arrow.","o":["Quadrate tubercle","Intertrochanteric crest","Lesser trochanter","Gluteal tuberosity"],"why":"Back of the femur: the intertrochanteric crest joins the two trochanters, and the small bump on the middle of that crest is the quadrate tubercle.","ref":"p.5–6","pic":{"src":"img/femP.jpg","w":300,"h":840,"a":[[168.0,186.0,"r"]]},"id":15},{"t":"w","lv":"m","sec":"Femur","stem":"Back of the femur.","parts":[["Name the ridge at the arrow.",["linea aspera"]]],"why":"The long rough ridge down the middle of the back of the shaft is the linea aspera (it has a medial and a lateral lip).","ref":"p.5","pic":{"src":"img/femP.jpg","w":300,"h":840,"a":[[157.0,380.0,"l"]]},"id":16},{"t":"m","lv":"e","sec":"Tibia & fibula","stem":"Identify the bone at the arrow.","o":["Patella","Tibia","Fibula","Femur"],"why":"The small bone in front of the knee joint is the patella (knee cap).","ref":"p.2","pic":{"src":"img/skel.jpg","w":453,"h":772,"a":[[224.0,402.0,"r"]]},"id":17},{"t":"m","lv":"e","sec":"Tibia & fibula","stem":"Front of the tibia and fibula. Identify the bump at the arrow.","o":["Tibial tuberosity","Intercondylar eminence","Medial condyle","Anterior border"],"why":"The bump on the front of the upper tibia, under the condyles, is the tibial tuberosity.","ref":"p.6","pic":{"src":"img/tib.jpg","w":410,"h":852,"a":[[298.0,184.0,"r"]]},"id":18},{"t":"m","lv":"m","sec":"Tibia & fibula","stem":"Identify the structure at the arrow.","o":["Lateral malleolus","Medial malleolus","Distal tibiofibular joint","Talus"],"why":"The lower end of the fibula is the lateral malleolus. The lower end of the tibia (other side) is the medial malleolus.","ref":"p.6","pic":{"src":"img/tib.jpg","w":410,"h":852,"a":[[150.0,805.0,"l"]]},"id":19},{"t":"w","lv":"h","sec":"Tibia & fibula","stem":"Front of the tibia and fibula.","parts":[["Name structure 1.",["intercondylar eminence","intercondylar"]],["Name structure 2.",["interosseous membrane","interosseus membrane"]]],"why":"1 is the raised part on top of the tibia between the two condyles = intercondylar eminence. 2 is the sheet joining the tibia and fibula = interosseous membrane.","ref":"p.6","pic":{"src":"img/tib.jpg","w":410,"h":852,"a":[[255.0,112.0,"t"],[230.0,430.0,"r",150.0]]},"id":20},{"t":"m","lv":"e","sec":"Foot","stem":"How many tarsal bones are there in one foot?","o":["7","5","8","14"],"why":"One foot = 7 tarsals, 5 metatarsals, 14 phalanges.","ref":"p.7","pic":null,"id":21},{"t":"m","lv":"m","sec":"Foot","stem":"Bones of the foot. Identify the bone at the arrow.","o":["Cuboid","Navicular","Lateral cuneiform","Talus"],"why":"On the lateral side of the foot, in front of the calcaneus, is the cuboid. The navicular is on the medial side, in front of the talus.","ref":"p.7","pic":{"src":"img/foot.jpg","w":460,"h":740,"a":[[302.0,505.0,"r"]]},"id":22},{"t":"w","lv":"m","sec":"Foot","stem":"Bones of the foot.","parts":[["Name bone 1.",["talus"]],["Name bone 2.",["navicular"]]],"why":"1 is the talus (sits on the calcaneus, under the tibia). 2 is the navicular, in front of the talus on the medial side.","ref":"p.7","pic":{"src":"img/foot.jpg","w":460,"h":740,"a":[[210.0,585.0,"r"],[148.0,505.0,"l"]]},"id":23},{"t":"m","lv":"e","sec":"Front of thigh","stem":"What is the nerve supply of rectus femoris?","o":["Femoral nerve","Obturator nerve","Sciatic nerve (tibial branch)","Superior gluteal nerve"],"why":"Every muscle of the front of the thigh (quadriceps + sartorius) is supplied by the femoral nerve.","ref":"p.8","pic":null,"id":24},{"t":"w","lv":"m","sec":"Front of thigh","stem":"Front of the thigh: one part of quadriceps femoris.","parts":[["Identify the muscle at the arrow.",["vastus intermedius"]],["What is its nerve supply?",["femoral"]]],"why":"This is vastus intermedius (the deepest part of quadriceps). All quadriceps parts: femoral nerve; extend the leg at the knee and stabilise the patella.","ref":"p.8","pic":{"src":"img/vi.jpg","w":643,"h":672,"a":[[145.0,390.0,"l"]]},"id":25},{"t":"m","lv":"m","sec":"Front of thigh","stem":"Identify the muscle at the arrow.","o":["Vastus medialis","Vastus lateralis","Vastus intermedius","Sartorius"],"why":"It lies on the medial side of the femur, above the knee: vastus medialis. Femoral nerve; extends the knee, stabilises the patella.","ref":"p.8","pic":{"src":"img/vm.jpg","w":421,"h":755,"a":[[105.0,440.0,"l"]]},"id":26},{"t":"m","lv":"m","sec":"Front of thigh","stem":"Which is an action of the muscle at the arrow?","o":["Flexion and abduction of the thigh at the hip","Adduction of the thigh","Extension of the hip","Extension of the leg at the knee"],"why":"The long strap crossing the thigh is sartorius: flexion + abduction of the thigh at the hip, and flexion + medial rotation of the leg at the knee. Femoral nerve.","ref":"p.8","pic":{"src":"img/sart.jpg","w":527,"h":691,"a":[[280.0,250.0,"r"]]},"id":27},{"t":"m","lv":"m","sec":"Front of thigh","stem":"All parts of quadriceps femoris extend the leg at the knee. Which one ALSO flexes the thigh at the hip?","o":["Rectus femoris","Vastus lateralis","Vastus intermedius","Vastus medialis"],"why":"Rectus femoris crosses the hip too: it extends the knee and flexes the hip. The three vasti extend the knee and stabilise the patella.","ref":"p.8","pic":null,"id":28},{"t":"w","lv":"m","sec":"Medial thigh","stem":"Medial (adductor) compartment of the thigh.","parts":[["Identify the muscle at the arrow.",["adductor longus"]],["What is its nerve supply?",["obturator","anterior division obturator","obturator anterior division"]]],"why":"This is adductor longus: adduction of the thigh; obturator nerve (anterior division).","ref":"p.9","pic":{"src":"img/addL.jpg","w":384,"h":723,"a":[[118.0,420.0,"l"]]},"id":29},{"t":"m","lv":"m","sec":"Medial thigh","stem":"Which muscle of the medial (adductor) compartment of the thigh is supplied by the FEMORAL nerve?","o":["Pectineus","Gracilis","Adductor longus","Adductor brevis"],"why":"Pectineus is the odd one: femoral nerve. Adductor longus, brevis and gracilis = obturator nerve (anterior division).","ref":"p.9","pic":null,"id":30},{"t":"m","lv":"h","sec":"Medial thigh","stem":"Identify the muscle at the arrow.","o":["Adductor brevis","Adductor longus","Pectineus","Gracilis"],"why":"This is adductor brevis (short, high up in the medial thigh). Action: adduction. Nerve: obturator (anterior division).","ref":"p.9","pic":{"src":"img/addB.jpg","w":408,"h":845,"a":[[118.0,425.0,"l"]]},"id":31},{"t":"w","lv":"h","sec":"Medial thigh","stem":"The muscle in the picture has two parts.","parts":[["Identify the muscle at the arrow.",["adductor magnus"]],["What nerve supplies its hamstring (ischial) part?",["tibial branch sciatic","tibial","sciatic","sciatic tibial","tibial part sciatic","tibial division sciatic"]]],"why":"Adductor magnus: adductor (pubic) part = obturator nerve; hamstring (ischial) part = tibial branch of the sciatic nerve. Actions: adduction, lateral rotation, flexion of the thigh.","ref":"p.9","pic":{"src":"img/addM.jpg","w":375,"h":736,"a":[[105.0,380.0,"l"]]},"id":32},{"t":"w","lv":"m","sec":"Medial thigh","stem":"Medial thigh.","parts":[["Identify the muscle at the arrow.",["gracilis"]],["Give ONE action of this muscle at the knee.",["flexion","flexion knee","knee flexion","flexes knee","flex knee"]]],"why":"The long thin strap on the medial side of the thigh is gracilis: adduction + lateral rotation of the thigh, and flexion of the knee. Obturator nerve (anterior division).","ref":"p.9","pic":{"src":"img/grac.jpg","w":293,"h":482,"a":[[127.0,330.0,"r"]]},"id":33},{"t":"m","lv":"h","sec":"Medial thigh","stem":"Besides adduction, which action do adductor magnus, gracilis and pectineus share?","o":["Lateral rotation of the thigh","Medial rotation of the thigh","Abduction of the thigh","Extension of the hip"],"why":"In your table adductor magnus, gracilis and pectineus all do adduction + lateral rotation of the thigh.","ref":"p.9","pic":null,"id":34},{"t":"m","lv":"e","sec":"Gluteal region","stem":"What is the nerve supply of gluteus maximus?","o":["Inferior gluteal nerve","Superior gluteal nerve","Sciatic nerve","Nerve to quadratus femoris"],"why":"Gluteus maximus = inferior gluteal nerve (L5, S1, S2). Medius, minimus and tensor fascia lata = superior gluteal nerve (L4, L5, S1).","ref":"p.11","pic":null,"id":35},{"t":"m","lv":"m","sec":"Gluteal region","stem":"Which muscle helps you rise from sitting and climb stairs?","o":["Gluteus maximus","Gluteus medius","Piriformis","Rectus femoris"],"why":"Gluteus maximus: powerful extension + lateral rotation of the hip, steadies knee and hip through the iliotibial tract, helps rising from sitting and climbing stairs.","ref":"p.11","pic":null,"id":36},{"t":"m","lv":"m","sec":"Gluteal region","stem":"Gluteus medius and gluteus minimus. Which pair of actions is right?","o":["Abduction and medial rotation of the thigh","Adduction and lateral rotation of the thigh","Extension and lateral rotation of the hip","Flexion and adduction of the thigh"],"why":"Medius and minimus: abduction, medial rotation of the thigh, and they keep the pelvis steady when walking. Superior gluteal nerve.","ref":"p.11","pic":null,"id":37},{"t":"w","lv":"h","sec":"Gluteal region","stem":"Lateral side of the hip and thigh.","parts":[["Identify the muscle at the arrow.",["tensor fascia lata","tensor fascia","tensor fasciae latae"]],["What is its nerve supply?",["superior gluteal"]]],"why":"The short muscle at the front of the lateral hip is tensor fascia lata: flexion + abduction of the thigh; superior gluteal nerve (L4, L5, S1). The long strap crossing to the medial side is sartorius.","ref":"p.11","pic":{"src":"img/tfl.jpg","w":290,"h":767,"a":[[144.0,195.0,"l",110.0]]},"id":38},{"t":"m","lv":"h","sec":"Gluteal region","stem":"The superior gluteal nerve (L4, L5, S1) supplies all of these EXCEPT:","o":["Gluteus maximus","Gluteus medius","Gluteus minimus","Tensor fascia lata"],"why":"Gluteus maximus is the exception: inferior gluteal nerve (L5, S1, S2).","ref":"p.11","pic":null,"id":39},{"t":"w","lv":"h","sec":"Gluteal region","stem":"Short lateral rotator muscles of the hip.","parts":[["Name muscle 1.",["piriformis"]],["What is the nerve supply of muscle 2?",["nerveto quadratus femoris"]]],"why":"1 is the top one, piriformis (nerve to piriformis, S1, S2). 2 is the lowest, quadratus femoris: nerve to quadratus femoris. All of them: lateral rotation of the thigh.","ref":"p.12","pic":{"src":"img/rot.jpg","w":669,"h":857,"a":[[190.0,380.0,"t",150.0],[330.0,560.0,"b",150.0]]},"id":40},{"t":"m","lv":"h","sec":"Gluteal region","stem":"What is the nerve supply of inferior gemellus?","o":["Nerve to quadratus femoris","Nerve to obturator internus","Nerve to piriformis","Inferior gluteal nerve"],"why":"Your notes: superior gemellus = nerve to obturator internus; inferior gemellus = nerve to quadratus femoris.","ref":"p.12","pic":null,"id":41},{"t":"w","lv":"m","sec":"Gluteal region","stem":"Back of the hip.","parts":[["Identify the muscle at the arrow.",["obturator internus"]],["What is its action?",["lateral rotation","lateral rotation thigh","lateral rotator","laterally rotates thigh","external rotation"]]],"why":"This is obturator internus: lateral rotation of the thigh; nerve to obturator internus.","ref":"p.12","pic":{"src":"img/oi.jpg","w":449,"h":700,"a":[[265.0,525.0,"b"]]},"id":42},{"t":"m","lv":"e","sec":"Gluteal region","stem":"Piriformis, obturator internus, the gemelli and quadratus femoris all do the same action. Which?","o":["Lateral rotation of the thigh","Medial rotation of the thigh","Abduction of the thigh","Extension of the knee"],"why":"They are the lateral rotators of the hip: every one of them = lateral rotation of the thigh.","ref":"p.10, p.12","pic":null,"id":43},{"t":"w","lv":"m","sec":"Back of thigh","stem":"Back of the thigh (hamstrings).","parts":[["Identify the muscle at the arrow.",["biceps femoris"]],["What is the nerve supply of its LONG head?",["tibial","tibial branch sciatic","sciatic tibial","tibial part sciatic"]]],"why":"Biceps femoris: long head = tibial nerve (part of sciatic), short head = common peroneal nerve. Actions: flexion of knee, extension of hip, lateral rotation of knee.","ref":"p.13","pic":{"src":"img/bf.jpg","w":512,"h":607,"a":[[275.0,340.0,"r"]]},"id":44},{"t":"m","lv":"m","sec":"Back of thigh","stem":"What is the nerve supply of the SHORT head of biceps femoris?","o":["Common peroneal nerve","Tibial nerve","Obturator nerve","Femoral nerve"],"why":"Biceps femoris: long head = tibial nerve, short head = common peroneal nerve (both from the sciatic).","ref":"p.13","pic":null,"id":45},{"t":"m","lv":"h","sec":"Back of thigh","stem":"Back of the thigh. Identify the muscle at the arrow.","o":["Biceps femoris","Semitendinosus","Semimembranosus","Gracilis"],"why":"The hamstring on the lateral side is biceps femoris. Semitendinosus and semimembranosus are on the medial side.","ref":"p.13","pic":{"src":"img/ham.jpg","w":255,"h":596,"a":[[172.0,225.0,"r",70.0]]},"id":46},{"t":"w","lv":"m","sec":"Back of thigh","stem":"Back of the thigh.","parts":[["Identify the muscle at the arrow.",["semimembranosus"]],["What is its nerve supply?",["sciatic","tibial","tibial branch sciatic","sciatic tibial","tibial part sciatic","tibial division sciatic"]]],"why":"Semimembranosus: flexion of knee, extension of hip, medial rotation of knee; sciatic nerve (tibial branch).","ref":"p.13","pic":{"src":"img/sm.jpg","w":756,"h":873,"a":[[318.0,450.0,"r"]]},"id":47},{"t":"m","lv":"h","sec":"Back of thigh","stem":"Which hamstring muscle LATERALLY rotates the knee?","o":["Biceps femoris","Semitendinosus","Semimembranosus","Adductor magnus"],"why":"Biceps femoris = lateral rotation of the knee. Semitendinosus and semimembranosus = medial rotation of the knee.","ref":"p.13","pic":null,"id":48},{"t":"w","lv":"e","sec":"Front of leg","stem":"Front of the leg.","parts":[["Identify the muscle at the arrow.",["tibialis anterior"]],["What is its nerve supply?",["anterior tibial","deep peroneal"]]],"why":"Tibialis anterior: dorsiflexion of the ankle + inversion (subtalar joint). Anterior tibial nerve (= deep peroneal), like the whole front of the leg.","ref":"p.14","pic":{"src":"img/ta.jpg","w":262,"h":825,"a":[[140.0,300.0,"r"]]},"id":49},{"t":"m","lv":"h","sec":"Front of leg","stem":"Which muscle of the FRONT of the leg EVERTS the foot?","o":["Peroneus tertius","Tibialis anterior","Extensor hallucis longus","Extensor digitorum longus"],"why":"Peroneus tertius = dorsiflexion of the ankle + eversion (subtalar joint). Tibialis anterior and extensor hallucis longus invert.","ref":"p.14","pic":null,"id":50},{"t":"m","lv":"m","sec":"Front of leg","stem":"Front of the leg. Identify the muscle at the arrow.","o":["Extensor digitorum longus","Extensor hallucis longus","Tibialis anterior","Peroneus brevis"],"why":"This is extensor digitorum longus (in front of the leg, lateral to tibialis anterior). Action: dorsiflexion of the ankle. Nerve: anterior tibial.","ref":"p.14","pic":{"src":"img/edl.jpg","w":375,"h":859,"a":[[208.0,440.0,"r"]]},"id":51},{"t":"m","lv":"e","sec":"Front of leg","stem":"Standing on your heels is:","o":["Dorsiflexion","Plantar flexion","Inversion","Eversion"],"why":"Your note: standing on the heels = dorsiflexion; standing on the toes = plantar flexion.","ref":"p.10","pic":null,"id":52},{"t":"w","lv":"m","sec":"Lateral leg","stem":"Lateral side of the leg.","parts":[["Identify the muscle at the arrow.",["peroneus brevis"]],["What is its nerve supply?",["superficial peroneal","musculocutaneous"]]],"why":"This is peroneus brevis (lateral leg, lower down than longus). Eversion + plantar flexion; superficial peroneal nerve (musculocutaneous).","ref":"p.15","pic":{"src":"img/pb.jpg","w":385,"h":623,"a":[[240.0,405.0,"r"]]},"id":53},{"t":"m","lv":"m","sec":"Lateral leg","stem":"What are the actions of peroneus longus?","o":["Eversion and plantar flexion","Inversion and dorsiflexion","Eversion and dorsiflexion","Inversion and plantar flexion"],"why":"Peroneus longus and brevis: eversion + plantar flexion; superficial peroneal nerve.","ref":"p.15","pic":null,"id":54},{"t":"w","lv":"e","sec":"Back of leg","stem":"Back of the leg.","parts":[["Identify the muscle at the arrow.",["gastrocnemius"]],["What is its nerve supply?",["tibial","medial popliteal"]]],"why":"Gastrocnemius: chief plantar flexor, flexes the weight-bearing knee, propels in walking, pumps venous blood. Tibial nerve.","ref":"p.16","pic":{"src":"img/gas.jpg","w":244,"h":900,"a":[[106.6,290.6,"r"]]},"id":55},{"t":"m","lv":"e","sec":"Back of leg","stem":"Which muscle is the CHIEF plantar flexor?","o":["Gastrocnemius","Soleus","Plantaris","Tibialis anterior"],"why":"Your table calls gastrocnemius the chief plantar flexor.","ref":"p.16","pic":null,"id":56},{"t":"m","lv":"h","sec":"Back of leg","stem":"Which muscle fixes the leg on the foot during walking?","o":["Soleus","Gastrocnemius","Plantaris","Popliteus"],"why":"Soleus: plantar flexion, propelling force in walking, venous pumping, and fixation of the leg on the foot during walking. Tibial (medial popliteal) nerve.","ref":"p.16","pic":null,"id":57},{"t":"w","lv":"m","sec":"Back of leg","stem":"Back of the leg.","parts":[["Identify the muscle at the arrow.",["plantaris"]],["Give ONE of its actions.",["flexion","plantar flexion","plantar flexor","flexion knee","knee flexion","flexes knee","flexor ankle"]]],"why":"Plantaris (small belly, very long thin tendon): plantar flexion + flexion of the knee. Tibial nerve.","ref":"p.16","pic":{"src":"img/plan.jpg","w":410,"h":884,"a":[[160.0,240.0,"r"]]},"id":58},{"t":"w","lv":"h","sec":"Back of leg","stem":"Back of the knee.","parts":[["Identify the muscle at the arrow.",["popliteus"]],["What is its main action?",["unlocking knee","unlocking","unlock knee","unlocks knee","unlocking knee joint","medial rotation tibia","initiation flexion knee"]]],"why":"Popliteus: unlocking of the knee joint (starts knee flexion from full extension by rotating the tibia medially). Tibi const DIR = { r: [1, 0], l: [-1, 0], t: [0, -1], b: [0, 1], tr: [.71, -.71], tl: [-.71, -.71], br: [.71, .71], bl: [-.71, .71] };
function drawArrows(box) {

    const m = 0.03 * Math.min(w, h) + (many ? 13 : 4) * k; let s = 1;

      <polygon points="${x},${y} ${bx + px * half},${by + py * half} ${bx - px * half},${by - py * half}" fill="#111"/>` +

    why = `<div class="why ${full ? 'ok' : 'bad'}"><b class="t">${full ? 'Right' : m ? 'Partly right' : (answered(q) ? 'Not quite' : 'Not answered')}${q.t === 'm' ? ': ' + esc(q.o[0]) : ''}</b>${esc(q.why)}<div class="ref">Your lower limb notes, ${esc(q.ref)}</div></div>`;
  }
  return `<div class="meta"><span class="num">${review ? 'Station ' + (S.order.indexOf(q.id) + 1) : ''}</span><span class="chip ${q.lv}">${LV[q.lv]}</span><span class="chip">${q.t === 'm' ? 'MCQ' : 'Written'}</span><span class="chip">${esc(q.sec)}</span></div>
    <h2 class="stem">${esc(q.stem)}</h2>${picHTML(q)}${body}${why}`;
}
const cap = s => s.replace(/\bnerveto\b/, 'nerve to').replace(/^./, c => c.toUpperCase());

function station() {
  window.scrollTo(0, 0); $('#layer').innerHTML = '';
  const q = BY[S.order[S.i]], last = S.i === S.order.length - 1;
  const checked = S.mode === 'practice' && S.checked[q.id];
  $('#mapbtn').hidden = false; $('#mapbtn').textContent = `${S.i + 1} / ${S.order.length}`;
  $('#track').style.width = (100 * S.order.filter(id => answered(BY[id])).length / S.order.length) + '%';
  app.innerHTML = `<section class="station" aria-live="polite">${stationHTML(q)}</section>
    <div class="dock"><div class="wrap">
      <button class="btn ghost back" id="prev" ${S.i ? '' : 'disabled'} aria-label="Previous station">←</button>
      ${S.mode === 'practice' && q.t === 'w' && !checked ? '<button class="btn accent" id="check">Check</button>' : ''}
      <button class="btn ${S.mode === 'practice' && q.t === 'w' && !checked ? 'ghost' : 'accent'}" id="next">${last ? 'Finish' : 'Next →'}</button>
    </div></div>`;
  wirePics(app);
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    S.ans[q.id] = +b.dataset.o;
    if (S.mode === 'practice') S.checked[q.id] = true;
    save(); refresh(q);
  });
  app.querySelectorAll('input[data-p]').forEach(inp => {
    inp.oninput = () => { const a = S.ans[q.id] = S.ans[q.id] || []; a[+inp.dataset.p] = inp.value; save(); };
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); const nx = app.querySelector(`input[data-p="${+inp.dataset.p + 1}"]`); if (nx) nx.focus(); else inp.blur(); } };
  });
  wireSelf(app, () => refresh(q));
  if ($('#check')) $('#check').onclick = () => { S.checked[q.id] = true; save(); refresh(q); };
  $('#prev').onclick = () => { if (S.i) { S.i--; save(); station(); } };
  $('#next').onclick = () => next();
  startTimer(q);
}
function refresh(q) {
  const keep = window.scrollY;
  const sec = $('.station', app); sec.innerHTML = stationHTML(q); wirePics(sec);
  // re-wire handlers on the redrawn part
  sec.querySelectorAll('.opt').forEach(b => b.onclick = () => { S.ans[q.id] = +b.dataset.o; if (S.mode === 'practice') S.checked[q.id] = true; save(); refresh(q); });
  sec.querySelectorAll('input[data-p]').forEach(inp => { inp.oninput = () => { const a = S.ans[q.id] = S.ans[q.id] || []; a[+inp.dataset.p] = inp.value; save(); }; });
  wireSelf(sec, () => refresh(q));
  const chk = $('#check'); if (chk && S.checked[q.id]) { chk.remove(); $('#next').className = 'btn accent'; }
  $('#track').style.width = (100 * S.order.filter(id => answered(BY[id])).length / S.order.length) + '%';
  window.scrollTo(0, keep);
  if (S.mode === 'practice' && S.checked[q.id]) { const w = $('.why', sec); if (w && w.getBoundingClientRect().top > innerHeight - 120) w.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
}
function wireSelf(root, after) {
  root.querySelectorAll('[data-self]').forEach(b => b.onclick = () => { S.self[b.dataset.self] = true; save(); after(); });
  root.querySelectorAll('[data-unself]').forEach(b => b.onclick = () => { delete S.self[b.dataset.unself]; save(); after(); });
}
function next() {
  const q = BY[S.order[S.i]];
  if (S.mode === 'practice' && q.t === 'w' && !S.checked[q.id] && answered(q)) { S.checked[q.id] = true; save(); refresh(q); return; }
  if (S.i < S.order.length - 1) { S.i++; save(); station(); return; }
  const miss = S.order.filter(id => !answered(BY[id])).length;
  if (miss) dialog('Finish the exam?', `${miss} station${miss > 1 ? 's are' : ' is'} not answered yet.`, 'Finish', finish);
  else finish();
}
function startTimer(q) {
  stopTimer();
  if (!S.timer || (S.mode === 'practice' && S.checked[q.id])) return;
  left = S.timer; const c = $('#clock'); c.hidden = false;
  const show = () => { c.textContent = '⏱ ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'); c.classList.toggle('low', left <= 10); };
  show();
  timerId = setInterval(() => {
    if (document.hidden) return;
    left--; show();
    if (left <= 0) {
      stopTimer();
      if (S.mode === 'practice') { S.checked[q.id] = true; save(); station(); toast('Time’s up'); }
      else { toast('Time’s up'); next(); }
    }
  }, 1000);
}

function openMap() {
  const L = $('#layer'), cur = S.order[S.i];
  L.innerHTML = `<div class="sheet" role="dialog" aria-label="All stations"><div class="sheet-in"><h3>All stations <button class="x" aria-label="Close">✕</button></h3>
    <div class="grid">${S.order.map((id, i) => {
      const q = BY[id]; let c = answered(q) ? 'done' : '';
      if (S.mode === 'practice' && S.checked[id]) c = marksOf(q) === maxOf(q) ? 'r' : 'w';
      return `<button class="${c} ${id === cur ? 'cur' : ''}" data-i="${i}" aria-label="Station ${i + 1}">${i + 1}</button>`;
    }).join('')}</div>
    <div class="legend"><span>■ answered</span><span>□ not yet</span>${S.mode === 'practice' ? '<span style="color:var(--ok)">■ right</span><span style="color:var(--bad)">■ wrong</span>' : ''}</div>
    <div class="row" style="margin-top:16px"><button class="btn ghost" id="mhome">Exam settings</button><button class="btn accent" id="mfin">Finish now</button></div></div></div>`;
  const close = () => L.innerHTML = '';
  $('.sheet', L).onclick = e => { if (e.target.classList.contains('sheet')) close(); };
  $('.x', L).onclick = close;
  L.querySelectorAll('.grid button').forEach(b => b.onclick = () => { S.i = +b.dataset.i; save(); close(); station(); });
  $('#mhome').onclick = () => { close(); startScreen(); };
  $('#mfin').onclick = () => { close(); const miss = S.order.filter(id => !answered(BY[id])).length; if (miss) dialog('Finish the exam?', `${miss} station${miss > 1 ? 's are' : ' is'} not answered yet.`, 'Finish', finish); else finish(); };
}
$('#mapbtn').onclick = () => S && openMap();
$('#home').onclick = () => { $('#layer').innerHTML = ''; startScreen(); };

function finish() {
  stopTimer(); S.done = true;
  const got = S.order.reduce((a, id) => a + marksOf(BY[id]), 0), max = S.order.reduce((a, id) => a + maxOf(BY[id]), 0);
  if (S.full) { const pc = Math.round(100 * got / max); DB.best = Math.max(DB.best || 0, pc); }
  save(); results();
}
function results(filter) {
  stopTimer(); window.scrollTo(0, 0); $('#layer').innerHTML = '';
  $('#mapbtn').hidden = true; $('#track').style.width = '100%';
  filter = filter || 'all';
  const qs = S.order.map(id => BY[id]);
  const got = qs.reduce((a, q) => a + marksOf(q), 0), max = qs.reduce((a, q) => a + maxOf(q), 0), pc = Math.round(100 * got / max);
  const grp = (f) => { const g = qs.filter(f); return [g.reduce((a, q) => a + marksOf(q), 0), g.reduce((a, q) => a + maxOf(q), 0)]; };
  const bar = (name, [a, b], col) => b ? `<div class="barrow"><span>${name}</span><div class="b"><i style="width:${100 * a / b}%;background:${col}"></i></div><span>${a} / ${b}</span></div>` : '';
  const msg = pc >= 90 ? 'Excellent. You are ready.' : pc >= 75 ? 'Good work. Fix the red ones below.' : pc >= 50 ? 'Getting there. Review the wrong ones and try again.' : 'Keep going. Practice mode shows the answer after each station.';
  const wrong = qs.filter(q => marksOf(q) < maxOf(q));
  const list = qs.filter(q => filter === 'all' || (filter === 'wrong' ? marksOf(q) < maxOf(q) : q.lv === filter));
  app.innerHTML = `<section class="res">
    <div class="score"><div class="ring" style="--p:${pc}"><div>${pc}%</div></div>
      <div><h1>${got} / ${max} marks</h1><p>${msg}</p>${S.full ? '' : '<p>(This round had only the stations you got wrong.)</p>'}</div></div>
    <div class="bars">${bar('Easy', grp(q => q.lv === 'e'), 'var(--e)')}${bar('Medium', grp(q => q.lv === 'm'), 'var(--m)')}${bar('Hard', grp(q => q.lv === 'h'), 'var(--h)')}
      ${bar('MCQ', grp(q => q.t === 'm'), 'var(--hema)')}${bar('Written', grp(q => q.t === 'w'), 'var(--hema)')}</div>
    <div class="row" style="margin-top:18px">${wrong.length ? `<button class="btn accent" id="redo">Redo the ${wrong.length} I got wrong</button>` : ''}<button class="btn ghost" id="again">New exam</button><button class="btn ghost" id="share2">Send to a friend</button></div>
    <div class="filters" role="group" aria-label="Show">${[['all', 'All'], ['wrong', 'Wrong'], ['e', 'Easy'], ['m', 'Medium'], ['h', 'Hard']].map(([v, t]) => `<button data-f="${v}" aria-pressed="${filter === v}">${t}</button>`).join('')}</div>
    <div class="list">${list.map(q => {
      const m = marksOf(q), mx = maxOf(q), c = m === mx ? 'r' : m ? 'p' : 'w';
      return `<div class="item" data-id="${q.id}"><button aria-expanded="false"><span class="mark ${c}">${c === 'r' ? '✓' : c === 'p' ? '½' : '✗'}</span><span class="s"><b>${S.order.indexOf(q.id) + 1}.</b> ${esc(q.stem)}</span><span class="pts">${m}/${mx}</span></button><div class="body" hidden></div></div>`;
    }).join('') || '<p class="note">Nothing here.</p>'}</div>
    <footer>Made from the lower limb notes · marks are kept on this phone only</footer></section>`;
  app.querySelectorAll('.item > button').forEach(b => b.onclick = () => {
    const it = b.parentElement, body = $('.body', it), q = BY[it.dataset.id], open = body.hidden;
    body.hidden = !open; b.setAttribute('aria-expanded', open);
    if (open) { body.innerHTML = `<div class="station">${stationHTML(q, true)}</div>`; wirePics(body); wireSelf(body, () => { save(); const y = scrollY; results(filter); window.scrollTo(0, y); const again = app.querySelector(`.item[data-id="${q.id}"] > button`); if (again) again.click(); }); }
  });
  app.querySelectorAll('.filters button').forEach(b => b.onclick = () => results(b.dataset.f));
  if ($('#redo')) $('#redo').onclick = () => newExam(wrong.map(q => q.id));
  $('#again').onclick = () => newExam();
  $('#share2').onclick = share;
}

document.addEventListener('keydown', e => {
  if (!S || S.done || $('#layer').innerHTML || !$('.station', app) || $('.res', app)) return;
  if (e.target.matches('input')) return;
  const k = e.key.toLowerCase(), i = 'abcd'.indexOf(k) >= 0 ? 'abcd'.indexOf(k) : '1234'.indexOf(k);
  const opts = app.querySelectorAll('.opt');
  if (i >= 0 && opts[i] && !opts[i].disabled) { opts[i].click(); e.preventDefault(); }
  else if (e.key === 'Enter' || e.key === 'ArrowRight') { $('#next') && $('#next').click(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { $('#prev') && !$('#prev').disabled && $('#prev').click(); }
});

startScreen();
</script>
</body>
</html>
